name: CI

on:
  push:
  pull_request:

jobs:
  prohori:
    name: Prohori (tests on the committed models + static build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - run: pip install -r requirements.txt -c constraints.txt
      - name: Tests (data invariants, leakage, policy, models, product, wrong-number check, complaints, federated learning)
        run: python -m pytest
      - name: Static in-browser build
        run: python tools/build_static.py

  ferot-archive:
    name: Ferot archive (Track 06 backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/ferot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: archive/ferot/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Build synthetic data and train models
        run: |
          python -m ferot.cli data
          python -m ferot.cli train
      - name: Tests
        run: python -m pytest

  ferot-web:
    name: Ferot archive (web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/ferot/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archive/ferot/web/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

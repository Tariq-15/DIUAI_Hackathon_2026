# Prohori Dataset Generator Configuration
# ==========================================
# All hard numbers live here - not in code.
# Change and re-run; the generator reads this at startup.
# VERIFY values marked VERIFY against upay official pages before citing them.

seed: 42

# --- Simulation window ---
sim_start: "2026-08-01"
sim_days: 60                       # 1 Aug – 29 Sep 2026
timezone: "Asia/Dhaka"

# --- Volume targets ---
n_customers: 10000
n_agents: 300
n_agent_peer_groups: 30            # division x area_type buckets
target_txn_rows: 600000            # ~10,000/day
fraud_rate: 0.005                  # 0.5 % of rows

# --- KYC tier daily/monthly/balance caps (BDT) ---  VERIFY on upay official page
kyc_caps:
  1:
    daily_send_limit:    10000
    monthly_send_limit:  25000
    max_balance:         25000
    per_txn_send_max:    10000
    daily_receive_limit: 10000
  2:
    daily_send_limit:    25000
    monthly_send_limit:  50000
    max_balance:         50000
    per_txn_send_max:    25000
    daily_receive_limit: 25000
  3:
    daily_send_limit:    50000
    monthly_send_limit:  200000
    max_balance:         100000
    per_txn_send_max:    50000
    daily_receive_limit: 50000

# Global hard caps
global_p2p_max_txn:    50000      # VERIFY
agent_cashout_max_txn: 30000      # VERIFY
atm_cashout_max_txn:   20000

# --- Fee schedule (fraction) ---  VERIFY on upay limits-and-charges page
fees:
  P2P_SEND:          0.0
  CASH_OUT_AGENT:    0.014        # ~1.4 %
  CASH_OUT_ATM:      0.008        # ~0.8 %
  CASH_IN:           0.0
  MERCHANT_PAY:      0.0
  BILL_PAY:          0.0
  AIRTIME:           0.0
  ADD_MONEY:         0.0
  REMITTANCE_IN:     0.0
  G2P_ALLOWANCE:     0.0

# --- Transaction type mix (normal rows) ---
txn_type_mix:
  P2P_SEND:          0.38
  CASH_OUT_AGENT:    0.18
  CASH_IN:           0.17
  AIRTIME:           0.10
  BILL_PAY:          0.07
  MERCHANT_PAY:      0.05
  CASH_OUT_ATM:      0.02
  ADD_MONEY:         0.015
  REMITTANCE_IN:     0.010
  G2P_ALLOWANCE:     0.005

# --- Channel mix ---
channel_mix:
  USSD:            0.50
  APP:             0.30
  AGENT_ASSISTED:  0.20

# --- Customer demographics ---
kyc_level_mix:   {1: 0.40, 2: 0.35, 3: 0.25}
gender_mix:      {M: 0.58, F: 0.42}
area_type_mix:   {urban: 0.40, semi-urban: 0.25, rural: 0.35}
device_type_mix: {smartphone: 0.30, feature_phone: 0.20, USSD-only: 0.50}
digital_literacy_mix: {low: 0.40, medium: 0.40, high: 0.20}
income_band_mix: {low: 0.45, lower-mid: 0.35, mid: 0.20}

# Bangladesh divisions with rough share of customer base
divisions:
  Dhaka:      0.30
  Chattogram: 0.20
  Rajshahi:   0.10
  Khulna:     0.10
  Sylhet:     0.10     # slightly higher fraud exposure
  Barishal:   0.08
  Mymensingh: 0.07
  Rangpur:    0.05

# Occupations (weighted draw)
occupations:
  - rickshaw/van driver
  - garment worker
  - small trader
  - farmer
  - student
  - housewife
  - migrant-worker family
  - service holder
  - day labourer
  - shop owner

# --- Behaviour profile by income band ---
# median_send_tk drawn from Lognormal(mu, sigma)
income_band_lognormal:
  low:       {mu: 7.0, sigma: 0.6}    # median ~Tk 1,100
  lower-mid: {mu: 7.5, sigma: 0.6}    # median ~Tk 1,800
  mid:       {mu: 8.0, sigma: 0.6}    # median ~Tk 3,000

# sends per week (Poisson lambda by income band)
sends_per_week:
  low:       1.5
  lower-mid: 2.5
  mid:       4.0
  shop_owner: 5.0

# regular_contacts range
regular_contacts_range: [3, 8]
regular_contact_p2p_share: 0.80   # 80 % of P2P to regular contacts

# --- Calendar effects ---
friday_uplift:        1.35         # +35 % Friday transfers
salary_days:          [1, 2, 3, 4, 5]
salary_cashin_uplift: 1.80
bill_days:            [20, 21, 22, 23, 24, 25, 26, 27, 28]
bill_uplift:          2.0

# Eid-like surge (days 22-26 of the window, i.e. 2026-08-22 to 2026-08-26)
eid_start_day: 22
eid_end_day:   26
eid_volume_multiplier:  2.5
eid_amount_multiplier:  2.2
eid_customer_fraction:  0.40

# --- Night activity ---
night_hours: [0, 1, 2, 3, 4]
night_max_fraction: 0.02

# Active hour peaks (weights, 24 elements)
hour_weights:
  - 0.003   # 00
  - 0.002   # 01
  - 0.002   # 02
  - 0.002   # 03
  - 0.003   # 04
  - 0.010   # 05
  - 0.020   # 06
  - 0.035   # 07
  - 0.055   # 08
  - 0.065   # 09  peak 08-10
  - 0.055   # 10
  - 0.040   # 11
  - 0.060   # 12  peak 12-14
  - 0.065   # 13
  - 0.055   # 14
  - 0.040   # 15
  - 0.035   # 16
  - 0.040   # 17
  - 0.055   # 18
  - 0.075   # 19  peak 19-22
  - 0.080   # 20
  - 0.070   # 21
  - 0.045   # 22
  - 0.010   # 23

# --- Agent capacity ranges (BDT per day) ---
agent_capacity:
  urban:      {min: 400000, max: 900000}
  semi-urban: {min: 200000, max: 500000}
  rural:      {min: 100000, max: 300000}

# --- Fraud class mix (share of ~3,000 fraud rows) ---
fraud_class_mix:
  S1: 0.45
  S2: 0.20
  S3: 0.15
  S4: 0.12
  S5: 0.05
  S6: 0.03

# Fraud injection parameters
fraud:
  s1_victim_count:          900
  s1_night_fraction:        0.60
  s1_drain_ratio_range:     [0.70, 0.98]
  s1_balance_range:         [3000, 30000]
  s1_recipient_age_h_range: [2, 72]
  s1_sends_in_15min:        [1, 3]
  s1_cashout_delay_min:     30

  s2_collector_count:       12
  s2_collector_age_d_range: [0.5, 3]
  s2_victims_per_collector: [15, 40]
  s2_victim_amount_range:   [200, 3000]
  s2_first_time_fraction:   0.85
  s2_cashout_ratio_range:   [0.80, 0.95]
  s2_cashout_delay_h:       [1, 3]

  s3_chain_count:           25
  s3_hops_range:            [2, 4]
  s3_wallet_age_d_range:    [1, 5]
  s3_forward_ratio_range:   [0.90, 0.99]
  s3_hop_delay_min:         [2, 15]

  s4_seller_count:          15
  s4_seller_age_d_range:    [3, 20]
  s4_buyers_per_seller:     [8, 30]
  s4_buyer_amount_range:    [500, 6000]
  s4_cashout_agent_count:   2

  s5_rogue_agent_count:     4
  s5_cashout_multiplier:    [7, 10]
  s5_days_active:           [5, 10]
  s5_flagged_wallet_share:  [0.40, 0.60]

  s6_victim_count:          45
  s6_hour_range:            [2, 6]
  s6_drain_ratio_range:     [0.60, 0.95]
  s6_recipient_age_h:       48
  s6_silence_h:             6

  s7_session_range_s:       [150, 600]
  s7_pin_attempts_range:    [2, 4]
  s7_amount_multiplier:     [5, 15]
  s7_recipient_age_h:       24

  weak_case_fraction:       0.20   # 20% ambiguous fraud

# Benign look-alike count = fraud_rows * 1.5
benign_lookalike_multiplier: 1.5

# --- Risk score fusion weights ---
fusion_weights:
  model:   0.5
  anomaly: 0.3
  graph:   0.2

# Risk band thresholds
risk_bands:
  ALLOW:  [0,  29]
  NUDGE:  [30, 59]
  WARN:   [60, 84]
  HIGH:   [85, 100]

# --- Merchants ---
n_merchants: 300
merchant_wallet_age_months_min: 6

# --- New-wallet fraction (register during window) ---
new_wallet_fraction: 0.05         # 5 % of customers

# --- Remittance / G2P ---
n_remittance_sources: 5
n_g2p_sources: 3
g2p_recipients: 300

# --- Balances ---
initial_balance_by_income:
  low:       {mu: 7.2, sigma: 0.8}   # lognormal params
  lower-mid: {mu: 7.6, sigma: 0.8}
  mid:       {mu: 8.1, sigma: 0.8}

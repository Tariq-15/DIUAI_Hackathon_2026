<!doctype html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prohori · Investigation Copilot (prototype)</title>
  <link rel="stylesheet" href="prohori.css">
  <script src="config.js"></script>
  <script src="engine.js"></script>
</head>
<body>
  <div class="an">
    <div class="proto" id="proto"><span data-bn="প্রোটোটাইপ, সিন্থেটিক ডেটা · upay-এর আসল সিস্টেম নয়">Prototype on synthetic data · not an upay system</span> · <b data-bn="মডেল স্কোর দেয়, নিয়ম সিদ্ধান্ত নেয়, মানুষ অনুমোদন করে">Models score, rules decide, people approve</b><span class="links"> ·
      <a href="app.html" style="color:#9fd0ff">customer app</a> · <a href="index.html" style="color:#9fd0ff">showcase</a></span></div>
    <header class="an-head">
      <div class="brand">প্রহরী <span>Copilot</span></div>
      <nav class="an-tabs" id="tabs">
        <button data-tab="alerts" class="on" data-bn="অ্যালার্ট">Alerts</button>
        <button data-tab="agents" data-bn="এজেন্ট ওয়াচ">Agent Watch</button>
        <button data-tab="model" data-bn="মডেল ও ন্যায্যতা">Model &amp; fairness</button>
        <button data-tab="fl" data-bn="ফেডারেটেড ও গোপনীয়তা">Federated &amp; privacy</button>
        <button data-tab="audit" data-bn="অডিট লগ">Audit log</button>
      </nav>
      <span class="grow"></span>
      <span class="small num" id="clock" style="color:#b9c3dc"></span>
      <button class="langsw" data-lang-toggle></button>
      <label class="small" style="color:#b9c3dc"><span data-bn="বিশ্লেষক">Analyst</span> <input id="analyst" placeholder="your name" data-bn-ph="আপনার নাম"></label>
    </header>

    <main class="an-body" id="tab-alerts">
      <aside class="panel">
        <h3><span data-bn="অ্যালার্ট তালিকা">Alert queue</span> <span class="small muted" id="count"></span></h3>
        <div class="filters" id="filters">
          <button data-f="all" class="on" data-bn="সব">All</button><button data-f="live" data-bn="লাইভ">Live</button>
          <button data-f="complaint" data-bn="অভিযোগ">Complaints</button><button data-f="wrong" data-bn="ভুল নম্বর">Wrong number</button>
          <button data-f="amount" data-bn="অস্বাভাবিক পরিমাণ">Unusual amount</button><button data-f="recharge" data-bn="রিচার্জ">Recharge</button>
          <button data-f="historical" data-bn="টেস্ট উইন্ডো">Test window</button>
          <button data-f="HOLD">HOLD</button><button data-f="planted" data-bn="সাজানো কেস">Planted cases</button>
        </div>
        <div class="feed" id="feed"></div>
      </aside>
      <section class="detail" id="detail"><div class="panel empty" data-bn="একটি অ্যালার্ট বেছে নিন। গ্রাহক অ্যাপ থেকে আসা নতুন অ্যালার্ট উপরে দেখাবে।">Pick an alert. New live alerts from the customer app appear at the top.</div></section>
    </main>

    <main class="an-body single hidden" id="tab-agents"><div class="panel" id="agents"></div></main>
    <main class="an-body single hidden" id="tab-model"><div class="panel" id="model"></div></main>
    <main class="an-body single hidden" id="tab-fl"><div class="panel" id="fl"></div></main>
    <main class="an-body single hidden" id="tab-audit"><div class="panel" id="audit"></div></main>
  </div>
  <script src="prohori.js"></script>
  <script src="analyst.js"></script>
</body>
</html>
